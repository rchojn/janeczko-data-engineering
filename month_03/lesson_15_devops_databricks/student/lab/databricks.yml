bundle:
  name: orders_pipeline

# Zastąp swoim workspace URL
workspace:
  host: https://adb-XXXX.azuredatabricks.net

targets:
  dev:
    mode: development
    workspace:
      root_path: /Shared/dev/${bundle.name}

  prod:
    mode: production
    workspace:
      root_path: /Shared/prod/${bundle.name}
    run_as:
      service_principal_name: sp-orders-pipeline@company.com

resources:
  jobs:
    orders_etl_job:
      name: "Orders ETL Pipeline [${bundle.target}]"

      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            num_workers: 2
            node_type_id: "Standard_DS3_v2"
            spark_conf:
              "spark.sql.adaptive.enabled": "true"
              "spark.sql.adaptive.skewJoin.enabled": "true"

      tasks:
        - task_key: bronze_ingestion
          description: "Raw data landing"
          job_cluster_key: main_cluster
          python_file: src/bronze_ingestion.py

        - task_key: silver_transform
          description: "Normalize and validate"
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: main_cluster
          python_file: src/silver_transform.py

        - task_key: gold_aggregate
          description: "Revenue metrics"
          depends_on:
            - task_key: silver_transform
          job_cluster_key: main_cluster
          python_file: src/gold_aggregate.py

      email_notifications:
        on_failure:
          - alerts@company.com

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"  # codziennie 6:00 UTC
        timezone_id: "Europe/Warsaw"
